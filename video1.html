<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeo</title>
    <style>
        body {
            background-color: #1a1a2e; /* Azul escuro */
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Ocupa toda a altura da tela */
            overflow: hidden; /* Impede barra de rolagem */
        }

        /* Contêiner do vídeo que vai ajustar o tamanho com base no tamanho da tela */
        .video-container {
            width: 100vw; /* 100% da largura da tela */
            height: 100vh; /* 100% da altura da tela */
            max-width: 100%; /* Garantir que o contêiner não ultrapasse a tela */
            max-height: 100%; /* Garantir que o contêiner não ultrapasse a tela */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Vídeo responsivo, quadrado, e escalando com a tela */
        video {
            width: 100vmin; /* 100% da menor dimensão entre a largura e altura da tela */
            height: 100vmin; /* 100% da menor dimensão entre a largura e altura da tela */
            object-fit: cover; /* Faz o vídeo cobrir toda a área sem distorcer */
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video controls>
            <source src="/videos/video1.mp4" type="video/mp4">
            Seu navegador não suporta a tag de vídeo.
        </video>
    </div>
</body>
</html>
