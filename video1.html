<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .video-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        video {
            max-width: 100%;
            max-height: 90vh;
            width: auto;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        /* Ajuste para telas muito pequenas */
        @media (max-width: 480px) {
            video {
                max-height: 80vh;
            }
            
            body {
                padding: 10px;
            }
        }

        /* Para garantir que em landscape o vídeo não fique muito grande */
        @media (orientation: landscape) and (max-height: 600px) {
            video {
                max-height: 85vh;
            }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video controls>
            <source src="videos/video1.mp4" type="video/mp4">
            Seu navegador não suporta a tag de vídeo.
        </video>
    </div>
</body>
</html>
