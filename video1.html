<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeo</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
            overflow: hidden;
        }

   
        .video-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }


        video {
            width: 100vmin; 
            height: 100vmin;
            object-fit: cover;
            max-width: 100%; 
            max-height: 100%;
        }


        @media (max-width: 768px) {
            body {
                height: 100vh;
            }

            .video-container {
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            video {
                width: 90vmin; 
                height: 90vmin;
            }
        }


        @media (orientation: landscape) {
            .video-container {
                justify-content: center;
                align-items: center;
            }

            video {
                width: 90vmin;
                height: 90vmin;
            }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video controls>
            <source src="/videos/video1.mp4" type="video/mp4">
            Seu navegador não suporta a tag de vídeo.
        </video>
    </div>
</body>
</html>
