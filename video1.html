<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeo</title>
    <style>

        body {
            background-color: #1a1a2e;
            color: white; 
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh; 
        }

        
        .video-container {
            width: 90vmin; 
            height: 90vmin; 
            max-width: 110%; 
            max-height: 90%; 
        }

        video {
            width: 110%; 
            height: 90%; 
            object-fit: cover; 
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video controls>
            <source src="/videos/video1.mp4" type="video/mp4">
            Seu navegador não suporta a tag de vídeo.
        </video>
    </div>
</body>
</html>
